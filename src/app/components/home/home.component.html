<div class="home-container">
  @if (entryService.isOffline()) {
    <div class="offline-banner">Live progress · view only</div>
  }
  <app-challenge-page-header
    eyebrowLabel="10,000 Push-Up Challenge — Log"
    [title]="entryService.isOffline() ? 'Live progress · view only' : 'Log your sets · private recording page'"
  >
  </app-challenge-page-header>
  <app-challenge-hero
    [total]="challengeData()?.totalRep ?? 0"
  ></app-challenge-hero>
  <app-tally-bar
    [total]="challengeData()?.totalRep ?? 0"
    [goal]="10000"
    [tickValue]="200"
  ></app-tally-bar>
  <span class="tally-note"
    >each stroke = 200 reps · slash closes a group of 1,000</span
  >
  <app-challenge-stats
    [challengeStatData]="challengeStatData()!"
  ></app-challenge-stats>
  @if (!entryService.isOffline()) {
    <app-log-set></app-log-set>
  }
  <app-calendar-heatmap
    [entryLogList]="challengeData()?.entryLogList ?? []"
  ></app-calendar-heatmap>
  <app-entry-history
    [entryLogList]="challengeData()?.entryLogList ?? []"
    (deleteEntry)="deleteEntry($event)"
  >
  </app-entry-history>
</div>
