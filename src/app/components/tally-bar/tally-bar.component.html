<div class="tally-row">
  @for (group of groups(); track $index) {
    <svg width="36" height="30" viewBox="0 0 36 30">
      @for (tick of group.ticks; track $index) {
        @let i = $index;
        <line
          [attr.x1]="4 + i * 8"
          y1="4"
          [attr.x2]="4 + i * 8"
          y2="26"
          [attr.stroke]="tick.filled ? '#E8511F' : '#3a3733'"
          [attr.stroke-opacity]="tick.opacity"
          stroke-width="2.5"
          stroke-linecap="round"
        />
      }
      <line
        x1="1"
        y1="27"
        x2="33"
        y2="2"
        [attr.stroke]="group.slash.filled ? '#E8511F' : '#3a3733'"
        [attr.stroke-opacity]="group.slash.opacity"
        stroke-width="2.5"
        stroke-linecap="round"
      />
    </svg>
  }
</div>
